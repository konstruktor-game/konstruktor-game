<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Konstruktor — dron, samolyot va mashina yig'ish ustaxonasi</title>
<meta name="description" content="Dron, RC samolyot va RC mashinani detallardan loyihalang, yig'ing, simlarini ulang, hisoblang va virtual sinovdan o'tkazing.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>">
<style>
:root{--bg:#0b0f16;--p1:#111824;--p2:#172131;--p3:#1e2a3e;--ln:rgba(255,255,255,.09);--tx:#e7edf7;--mu:#8e9bb3;--ac:#ffb020;--ac2:#4aa3ff;--ok:#2ecc71;--bad:#ff5a5a;--warn:#ffb020;--info:#5ab4ff;--r:12px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font:14px/1.45 'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--ac2)}
.hidden{display:none!important}
#app{display:grid;grid-template-rows:56px 1fr;height:100vh;height:100dvh}
header{display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--p1);border-bottom:1px solid var(--ln);min-width:0;overflow-x:auto;scrollbar-width:none}header::-webkit-scrollbar{display:none}
html,body{overflow-x:hidden}
#metrics,#panel,#steps{scrollbar-width:thin;scrollbar-color:#2a3850 transparent}
.logo{font-weight:900;font-size:18px;white-space:nowrap;display:flex;gap:8px;align-items:center}
.logo small{font-weight:600;color:var(--mu);font-size:12px}
.typeSw{display:flex;background:var(--p2);border-radius:10px;padding:3px;gap:2px}
.typeSw button{padding:6px 10px;border-radius:8px;font-weight:700;color:var(--mu);white-space:nowrap}
.typeSw button.on{background:var(--ac);color:#1a1200}
#pName{flex:1;min-width:80px;max-width:280px;background:var(--p2);border:1px solid var(--ln);border-radius:8px;padding:7px 10px;font-weight:700}
.hb{padding:7px 11px;border-radius:8px;background:var(--p2);border:1px solid var(--ln);font-weight:700;white-space:nowrap}
.hb:hover{background:var(--p3)}.hb.pri{background:var(--ac);color:#1a1200;border-color:transparent}
.hsp{flex:1}
main{display:grid;grid-template-columns:230px 1fr 400px;min-height:0}
#steps{background:var(--p1);border-right:1px solid var(--ln);overflow-y:auto;padding:10px}
.st{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 10px;border-radius:10px;margin-bottom:4px;color:var(--mu);font-weight:600}
.st:hover{background:var(--p2);color:var(--tx)}.st.on{background:var(--p3);color:var(--tx);box-shadow:inset 3px 0 0 var(--ac)}
.st .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--p2);font-size:13px;flex:none}
.st.done .n{background:var(--ok);color:#06210f}.st .pg{margin-left:auto;font-size:11px;color:var(--mu)}
.stHead{font-size:11px;font-weight:800;color:var(--mu);letter-spacing:.08em;margin:6px 6px 8px}
#viewWrap{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}
#view{position:relative;flex:1;min-height:0;overflow:hidden;background:#0e1219;touch-action:none}
#view canvas{display:block;width:100%;height:100%}
#hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(10,15,24,.86);border:1px solid var(--ln);border-radius:20px;padding:8px 16px;font-weight:700;max-width:90%;text-align:center;pointer-events:none;backdrop-filter:blur(6px)}
#vtools{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:6px}
.vt{width:40px;height:40px;border-radius:10px;background:rgba(10,15,24,.85);border:1px solid var(--ln);font-size:17px}
.vt.on{background:var(--ac);color:#1a1200}
#tip{position:absolute;pointer-events:none;background:rgba(8,12,20,.95);border:1px solid var(--ln);border-radius:10px;padding:8px 11px;max-width:260px;font-size:12.5px;z-index:5}
#tip b{display:block;font-size:13.5px;margin-bottom:2px;color:var(--ac)}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-100%);background:rgba(8,12,20,.82);border:1px solid rgba(255,176,32,.5);color:#fff;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap}
.lbl:after{content:'';position:absolute;left:50%;bottom:-7px;width:1px;height:7px;background:rgba(255,176,32,.7)}
#metrics{display:flex;gap:6px;padding:8px;background:var(--p1);border-top:1px solid var(--ln);overflow-x:auto}
.mt{flex:1;min-width:112px;background:var(--p2);border-radius:10px;padding:6px 10px;border-left:3px solid var(--mu)}
.mt small{display:block;color:var(--mu);font-size:11px;font-weight:600;white-space:nowrap}.mt b{font-size:15.5px;white-space:nowrap}
.mt.ok{border-color:var(--ok)}.mt.warn{border-color:var(--warn)}.mt.bad{border-color:var(--bad)}
#panel{background:var(--p1);border-left:1px solid var(--ln);overflow-y:auto;padding:16px}
#panel h2{font-size:20px;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.intro{color:#c4cee0;margin-bottom:14px}
.card{background:var(--p2);border:1px solid var(--ln);border-radius:var(--r);padding:12px 12px 6px;margin-bottom:12px}
.card h3{font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.card h3 .sp{flex:1}
.fld{margin-bottom:10px}
.fl{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12.5px;color:#c4cee0;font-weight:600;margin-bottom:3px}
.fl b{color:var(--tx);font-size:13px}
.q{width:18px;height:18px;border-radius:50%;background:var(--p3);font-size:11px;font-weight:900;color:var(--ac2);flex:none}
.rg{display:flex;gap:8px;align-items:center}.rg input[type=range]{flex:1;accent-color:var(--ac)}
.rg input[type=number]{width:78px;background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:3px 6px;text-align:right}
select,.inp{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:7px 9px}
.tg{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;font-weight:600;color:#c4cee0;padding:4px 0}
.sw{position:relative;width:40px;height:22px;border-radius:11px;background:var(--p3);flex:none}
.sw:after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#9aa;transition:.15s}
.sw.on{background:var(--ok)}.sw.on:after{left:21px;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{padding:5px 10px;border-radius:16px;background:var(--p3);font-size:12px;font-weight:700;color:#c4cee0}
.chip:hover,.chip.on{background:var(--ac);color:#1a1200}
.info{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:12.5px;color:var(--mu);padding:8px 0 6px;border-top:1px dashed var(--ln);margin-top:6px}
.info b{color:var(--tx)}
.slots{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px}
.sl{padding:5px 9px;border-radius:8px;background:var(--p3);font-size:12px;font-weight:700;color:var(--mu)}
.sl.ok{background:rgba(46,204,113,.16);color:var(--ok)}.sl.next{outline:1px dashed var(--ac2);color:var(--ac2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:10px;background:var(--p3);font-weight:800;border:1px solid var(--ln)}
.btn:hover{filter:brightness(1.15)}.btn.pri{background:var(--ac);color:#1a1200;border-color:transparent}.btn.ok{background:var(--ok);color:#06210f}.btn.danger{background:#5a1d22;color:#ffd0d0}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>.btn{flex:1}
.nav{display:flex;gap:8px;margin-top:14px;position:sticky;bottom:-16px;background:var(--p1);padding:10px 0 16px}
.nav .btn{flex:1}
.iss{border-radius:10px;padding:9px 11px;margin-bottom:7px;background:var(--p2);border-left:4px solid var(--mu);font-size:13px}
.iss b{display:block;margin-bottom:2px}.iss span{color:#b9c4d8;font-size:12.5px}
.iss.bad{border-color:var(--bad)}.iss.warn{border-color:var(--warn)}.iss.ok{border-color:var(--ok)}.iss.info{border-color:var(--info)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv{background:var(--p2);border-radius:10px;padding:8px 10px}.kv small{color:var(--mu);font-size:11.5px;display:block}.kv b{font-size:16px}
table{width:100%;border-collapse:collapse;font-size:12.5px}th,td{padding:6px 5px;border-bottom:1px solid var(--ln);text-align:left}th{color:var(--mu);font-weight:700;font-size:11.5px}
td.n,th.n{text-align:right}
.bar{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:6px 0}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--mu)}.leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
textarea{width:100%;min-height:120px;background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px;font:12px/1.5 Consolas,monospace}
/* simlar */
#wires{position:absolute;inset:0;background:radial-gradient(ellipse at center,#152033,#0b111c);z-index:3}
#wires svg{width:100%;height:100%;display:block;touch-action:none}
.pad{cursor:pointer}.wend{cursor:grab}.wend:active{cursor:grabbing}
/* sinov */
#hud{position:absolute;inset:0;pointer-events:none;z-index:4}
.hudL{position:absolute;left:12px;top:12px;background:rgba(8,12,20,.78);border-radius:12px;padding:10px 14px;font-size:13px;line-height:1.7;min-width:180px}
.hudL b{font-size:15px}
#hudMsg{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);background:rgba(8,12,20,.85);border-radius:12px;padding:10px 16px;font-weight:700;max-width:80%;text-align:center}
#hudFail{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(40,0,0,.45);pointer-events:auto}
#hudFail div{background:var(--p1);border:1px solid var(--bad);border-radius:16px;padding:20px 24px;max-width:460px;text-align:center}
#hudFail h3{color:var(--bad);font-size:22px;margin-bottom:8px}
.stick{position:absolute;bottom:24px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.2);pointer-events:auto;touch-action:none}
.stick i{position:absolute;left:43px;top:43px;width:44px;height:44px;border-radius:50%;background:rgba(255,176,32,.6)}
#stL{left:20px}#stR{right:20px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(4,7,12,.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.mbox{background:var(--p1);border:1px solid var(--ln);border-radius:16px;width:100%;max-width:760px;max-height:90vh;overflow-y:auto;padding:22px;position:relative}
.mbox h2{font-size:22px;margin-bottom:6px}.mclose{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;background:var(--p2);font-size:18px}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:12px 0}
.tcard{background:var(--p2);border:2px solid var(--ln);border-radius:14px;padding:14px;text-align:left}
.tcard:hover,.tcard.on{border-color:var(--ac)}.tcard .ic{font-size:34px}.tcard b{display:block;font-size:15px;margin:4px 0}.tcard span{color:var(--mu);font-size:12.5px}
.gl{border-bottom:1px solid var(--ln);padding:10px 0}.gl b{color:var(--ac)}.gl small{color:var(--mu)}
.gl p{font-size:13px;color:#c4cee0;margin-top:3px}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ac);color:#1a1200;padding:10px 18px;border-radius:10px;font-weight:800;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.pop{position:fixed;z-index:55;background:var(--p1);border:1px solid var(--ac2);border-radius:12px;padding:12px 14px;max-width:320px;font-size:13px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.pop b{color:var(--ac);font-size:14px}.pop p{margin-top:5px;color:#c4cee0}
@media (max-width:1300px){.hide-s,.logo small{display:none}.typeSw button span{display:none}}
@media (max-width:1100px){main{grid-template-columns:62px 1fr 340px}.st span,.st .pg,.stHead{display:none}.st{justify-content:center;padding:9px 0}}
@media (max-width:760px){
 #app{grid-template-rows:auto 1fr;height:auto;min-height:100dvh}
 header{flex-wrap:wrap;padding:8px 10px;gap:6px}.logo small,.hide-s{display:none}#pName{order:5;max-width:none;flex-basis:100%}
 main{grid-template-columns:1fr;grid-template-rows:auto 58vh auto}
 #steps{display:flex;overflow-x:auto;padding:6px;border-right:0;border-bottom:1px solid var(--ln)}.stHead{display:none}.st{flex:none;width:auto;padding:6px;margin:0 3px 0 0}
 #viewWrap{height:58vh}#panel{border-left:0}.stick{width:110px;height:110px}.stick i{left:33px;top:33px}
}
@media print{header,#steps,#viewWrap,.nav,.noprint{display:none!important}main{display:block}#panel{overflow:visible;background:#fff;color:#000}.card,.iss,.kv{background:#fff;color:#000;border-color:#ccc}}
</style>
</head>
<body>
<div id="app">
 <header>
  <div class="logo">🛠️ Konstruktor <small>loyihala · yig'· sina</small></div>
  <div class="typeSw" id="typeSw"></div>
  <input id="pName" maxlength="60" aria-label="Loyiha nomi">
  <button class="hb" id="bUndo" title="Bekor qilish (Ctrl+Z)">↶</button><button class="hb" id="bRedo" title="Qaytarish (Ctrl+Y)">↷</button>
  <span class="hsp"></span>
  <button class="hb" id="bNew">➕ <span class="hide-s">Yangi</span></button>
  <button class="hb" id="bGloss">📖 <span class="hide-s">Lug'at</span></button>
  <button class="hb" id="bGallery">🖼️ <span class="hide-s">Galereya</span></button>
  <button class="hb" id="bShare">🔗 <span class="hide-s">Saqlash / ulashish</span></button>
  <button class="hb" id="bAcc">👤 <span id="accName" class="hide-s">Kirish</span></button>
  <button class="hb" id="bMute" title="Ovoz">🔊</button>
 </header>
 <main>
  <nav id="steps"></nav>
  <section id="viewWrap">
   <div id="view">
    <div id="labels"></div>
    <div id="hint"></div>
    <div id="vtools">
     <button class="vt" id="tExplode" title="Detallarga ajratib ko'rish">💥</button>
     <button class="vt on" id="tLabels" title="Detal nomlari">🏷️</button>
     <button class="vt" id="tXray" title="Ichini ko'rish (shaffof korpus)">🔍</button>
     <button class="vt" id="tFit" title="Kamerani markazlash">🎯</button>
     <button class="vt on" id="tAuto" title="Avtomatik aylanish">🔄</button>
     <button class="vt" id="tShot" title="Rasmini saqlash (PNG)">📸</button>
    </div>
    <div id="tip" class="hidden"></div>
    <div id="wires" class="hidden"></div>
    <div id="hud" class="hidden">
     <div class="hudL" id="hudL"></div><div id="hudMsg"></div>
     <div class="stick hidden" id="stL"><i></i></div><div class="stick hidden" id="stR"><i></i></div>
     <div id="hudFail" class="hidden"></div>
    </div>
   </div>
   <div id="metrics"></div>
  </section>
  <aside id="panel"></aside>
 </main>
</div>
<div id="modal" class="modal hidden"><div class="mbox" id="mbox"></div></div>
<script src="/lib/three.js"></script>
<script src="/konstruktor/core.js"></script>
<script src="/konstruktor/gloss.js"></script>
<script src="/konstruktor/t_copter.js"></script>
<script src="/konstruktor/t_plane.js"></script>
<script src="/konstruktor/t_car.js"></script>
<script src="/konstruktor/sim.js"></script>
<script src="/konstruktor/app.js"></script>
</body>
</html>
