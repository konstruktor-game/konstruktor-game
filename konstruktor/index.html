<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Konstruktor — dron, samolyot va mashina yig'ish ustaxonasi</title>
<meta name="description" content="Dron, RC samolyot va RC mashinani detallardan loyihalang, yig'ing, simlarini ulang, hisoblang va virtual sinovdan o'tkazing.">
<link rel="icon" type="image/png" href="/konstruktor/img/favicon.png">
<meta property="og:title" content="Konstruktor — dron, samolyot va mashina yig'ish ustaxonasi">
<meta property="og:image" content="/konstruktor/img/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ================= Konstruktor dizayn tizimi =================
   Ranglar logodan: sariq (#FFB020) — asosiy urg'u, to'q grafit — fon. Shrift: Inter. */
:root{
 --bg:#090c12;--bg2:#0d121a;--p1:#11161f;--p2:#161d28;--p3:#1d2633;--p4:#243042;
 --ln:rgba(255,255,255,.07);--ln2:rgba(255,255,255,.12);
 --tx:#e9eef6;--tx2:#c3ccda;--mu:#7f8ca3;
 --ac:#ffb020;--ac-d:#e0960d;--ac-soft:rgba(255,176,32,.12);--ac2:#4aa3ff;
 --ok:#2fcf7a;--bad:#ff5d5d;--warn:#ffb020;--info:#5aaeff;
 --r:14px;--r-s:10px;--sh:0 10px 30px rgba(0,0,0,.35);--sh-s:0 2px 8px rgba(0,0,0,.25)
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:radial-gradient(1200px 600px at 70% -10%,#16202e 0%,var(--bg) 60%) fixed;color:var(--tx);font:13px/1.5 Inter,'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--ac2)}
.hidden{display:none!important}
::selection{background:var(--ac);color:#1a1200}
*{scrollbar-width:thin;scrollbar-color:#2a3546 transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#2a3546;border-radius:8px}

/* ---------- karkas ---------- */
#app{display:grid;grid-template-rows:56px 1fr;height:100vh;height:100dvh}
header{display:flex;align-items:center;gap:8px;padding:0 14px;background:rgba(12,16,23,.72);backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid var(--ln);min-width:0;overflow-x:auto;scrollbar-width:none;position:relative;z-index:10}
header::-webkit-scrollbar{display:none}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap;margin-right:6px}
.logo img{display:block;width:28px;height:28px;filter:drop-shadow(0 0 8px rgba(255,176,32,.35))}
.logo small{font-weight:500;color:var(--mu);font-size:11.5px;letter-spacing:0}
.typeSw{display:flex;background:var(--p2);border:1px solid var(--ln);border-radius:11px;padding:3px;gap:2px;min-width:0;max-width:100%;overflow-x:auto;scrollbar-width:none}.typeSw::-webkit-scrollbar{display:none}.typeSw button{flex:none}
.typeSw button{display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:8px;font-weight:500;font-size:12.5px;color:var(--mu);transition:.15s}
.typeSw button:hover{color:var(--tx)}
.typeSw button.on{background:var(--ac);color:#1a1200;font-weight:600;box-shadow:0 4px 14px rgba(255,176,32,.25)}
#pName{flex:1;min-width:90px;max-width:260px;background:transparent;border:1px solid transparent;border-radius:9px;padding:6px 10px;font-weight:600;font-size:13px;transition:.15s}
#pName:hover{border-color:var(--ln2)}#pName:focus{outline:none;border-color:var(--ac);background:var(--p2)}
.hb{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:9px;color:var(--tx2);font-weight:500;font-size:12.5px;white-space:nowrap;transition:.15s;border:1px solid transparent}
.hb:hover{background:var(--p2);border-color:var(--ln);color:var(--tx)}
.hsp{flex:1}
main{display:grid;grid-template-columns:232px 1fr 368px;gap:10px;padding:10px;min-height:0}

/* ---------- bosqichlar (chap) ---------- */
#steps{background:var(--p1);border:1px solid var(--ln);border-radius:var(--r);overflow-y:auto;padding:12px 10px;position:relative}
.stHead{font-size:10.5px;font-weight:600;color:var(--mu);letter-spacing:.08em;text-transform:uppercase;margin:2px 6px 4px}
.stProg{height:4px;border-radius:4px;background:var(--p3);margin:6px 6px 12px;overflow:hidden}.stProg i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),#ffd37a);border-radius:4px;transition:width .4s}
.st{position:relative;display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:7px 8px;border-radius:10px;margin-bottom:2px;color:var(--mu);font-weight:500;font-size:12.5px;transition:.15s}
.st:not(:last-child):after{content:'';position:absolute;left:19px;top:31px;width:2px;height:calc(100% - 22px);background:var(--p3);border-radius:2px}
.st.done:not(:last-child):after{background:rgba(47,207,122,.35)}
.st:hover{background:var(--p2);color:var(--tx)}
.st.on{background:var(--ac-soft);color:var(--tx)}
.st .n{position:relative;z-index:1;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--p3);font-size:11px;font-weight:600;flex:none;border:2px solid var(--bg2)}
.st.on .n{background:var(--ac);color:#1a1200}
.st.done .n{background:var(--ok);color:#052313}
.st .pg{margin-left:auto;font-size:10.5px;color:var(--mu);font-variant-numeric:tabular-nums}

/* ---------- 3D ko'rinish (markaz) ---------- */
#viewWrap{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;gap:10px}
#view{position:relative;flex:1;min-height:0;overflow:hidden;background:#0e1219;touch-action:none;border-radius:var(--r);border:1px solid var(--ln);box-shadow:var(--sh)}
#view canvas{display:block;width:100%;height:100%}
#hint{position:absolute;top:12px;left:12px;max-width:calc(100% - 190px);background:rgba(10,14,21,.78);backdrop-filter:blur(10px);border:1px solid var(--ln2);border-radius:10px;padding:6px 12px;font-weight:500;font-size:12px;color:var(--tx2);pointer-events:none;display:flex;gap:7px;align-items:center}
#vtools{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:5px;align-items:stretch}
.vt{height:31px;padding:0 11px;border-radius:9px;background:rgba(10,14,21,.78);backdrop-filter:blur(10px);border:1px solid var(--ln2);font-size:11.5px;font-weight:500;display:flex;align-items:center;gap:8px;color:var(--tx2);white-space:nowrap;transition:.15s}
.vt:hover{background:rgba(29,38,51,.92);color:var(--tx)}
.vt.on{background:rgba(255,176,32,.14);border-color:rgba(255,176,32,.6);color:var(--ac)}
#tip{position:absolute;pointer-events:none;background:rgba(10,14,21,.94);backdrop-filter:blur(8px);border:1px solid var(--ln2);border-radius:10px;padding:7px 10px;max-width:250px;font-size:11.5px;color:var(--tx2);z-index:5;box-shadow:var(--sh-s)}
#tip b{display:block;font-size:12.5px;font-weight:600;margin-bottom:2px;color:var(--ac)}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-100%);background:rgba(10,14,21,.82);backdrop-filter:blur(6px);border:1px solid rgba(255,176,32,.35);color:#fff;font-size:10.5px;font-weight:500;padding:2px 7px;border-radius:6px;white-space:nowrap}
.lbl:after{content:'';position:absolute;left:50%;bottom:-7px;width:1px;height:6px;background:rgba(255,176,32,.6)}
#metrics{display:flex;gap:8px;overflow-x:auto;flex:none}
.mt{flex:1;min-width:110px;background:var(--p1);border:1px solid var(--ln);border-radius:12px;padding:7px 11px;position:relative;overflow:hidden}
.mt:before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--p4)}
.mt small{display:block;color:var(--mu);font-size:10.5px;font-weight:500;white-space:nowrap}
.mt b{font-size:14px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.mt.ok:before{background:var(--ok)}.mt.warn:before{background:var(--warn)}.mt.bad:before{background:var(--bad)}

/* ---------- o'ng panel ---------- */
#panel{background:var(--p1);border:1px solid var(--ln);border-radius:var(--r);overflow-y:auto;padding:16px 14px 0}
#panel h2{font-size:16px;font-weight:600;letter-spacing:-.01em;margin-bottom:4px;display:flex;gap:10px;align-items:center}
#panel h2 .i{width:30px;height:30px;padding:7px;border-radius:9px;background:var(--ac-soft);color:var(--ac);background-clip:content-box;-webkit-mask-origin:content-box;mask-origin:content-box;box-sizing:border-box;flex:none;background-color:var(--ac)}
.intro{color:var(--tx2);margin-bottom:14px;font-size:12.5px;line-height:1.55}
.card{background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:12px 12px 6px;margin-bottom:10px}
.card h3{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:9px}
.card h3 .sp{flex:1}
.fld{margin-bottom:11px}
.fl{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;color:var(--tx2);font-weight:500;margin-bottom:4px}
.fl b{color:var(--tx);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.q{width:16px;height:16px;border-radius:50%;background:var(--p4);font-size:10px;font-weight:700;color:var(--ac2);flex:none;line-height:16px}
.q:hover{background:var(--ac2);color:#fff}
.rg{display:flex;gap:8px;align-items:center}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;background:var(--p4);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--ac);border:3px solid var(--p2);box-shadow:0 0 0 1px var(--ac);cursor:pointer}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--ac);border:3px solid var(--p2);box-shadow:0 0 0 1px var(--ac);cursor:pointer}
.rg input[type=number]{width:70px;background:var(--bg2);border:1px solid var(--ln);border-radius:8px;padding:4px 7px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums}
select,.inp{width:100%;background:var(--bg2);border:1px solid var(--ln);border-radius:9px;padding:6px 9px;font-size:12.5px;transition:.15s}
select:focus,.inp:focus,.rg input[type=number]:focus{outline:none;border-color:var(--ac)}
.tg{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:500;color:var(--tx2);padding:4px 0}
.sw{position:relative;width:36px;height:20px;border-radius:10px;background:var(--p4);flex:none;transition:.15s}
.sw:after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#9aa6b8;transition:.15s}
.sw.on{background:var(--ok)}.sw.on:after{left:19px;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:11px}
.chip{padding:4px 9px;border-radius:20px;background:var(--p3);border:1px solid var(--ln);font-size:11px;font-weight:500;color:var(--tx2);transition:.15s}
.chip:hover,.chip.on{background:var(--ac-soft);border-color:rgba(255,176,32,.5);color:var(--ac)}
.info{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:11.5px;color:var(--mu);padding:9px 0 7px;border-top:1px dashed var(--ln2);margin-top:4px}
.info b{color:var(--tx);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.slots{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 8px}
.sl{padding:3px 9px;border-radius:20px;background:var(--p3);font-size:11px;font-weight:500;color:var(--mu)}
.sl.ok{background:rgba(47,207,122,.13);color:var(--ok)}.sl.next{box-shadow:inset 0 0 0 1px var(--ac2);color:var(--ac2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 13px;border-radius:10px;background:var(--p3);font-weight:600;font-size:12.5px;border:1px solid var(--ln2);color:var(--tx);transition:.15s}
.btn:hover{background:var(--p4)}
.btn.pri{background:linear-gradient(180deg,#ffc04a,var(--ac));color:#1a1200;border-color:transparent;box-shadow:0 6px 18px rgba(255,176,32,.22)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ok{background:var(--ok);color:#052313;border-color:transparent}
.btn.danger{background:rgba(255,93,93,.14);color:#ffb3b3;border-color:rgba(255,93,93,.35)}
.btn:disabled{opacity:.4;cursor:default;box-shadow:none}
.btn.big{width:100%;margin-top:12px;padding:11px;font-size:13.5px}
.row{display:flex;gap:7px;flex-wrap:wrap}.row>.btn{flex:1}
.nav{display:flex;gap:8px;margin:14px -14px 0;position:sticky;bottom:0;background:linear-gradient(180deg,rgba(17,22,31,0),var(--p1) 30%);padding:14px 14px 14px}
.nav .btn{flex:1}
.iss{border-radius:10px;padding:8px 11px;margin-bottom:6px;background:var(--p2);border:1px solid var(--ln);border-left:3px solid var(--mu);font-size:12px}
.iss b{display:flex;gap:6px;align-items:flex-start;margin-bottom:2px;font-weight:600}.iss span{display:block;color:var(--tx2);font-size:11.5px;line-height:1.5}
.iss.bad{border-left-color:var(--bad)}.iss.bad b .i{color:var(--bad)}
.iss.warn{border-left-color:var(--warn)}.iss.warn b .i{color:var(--warn)}
.iss.ok{border-left-color:var(--ok)}.iss.ok b .i{color:var(--ok)}
.iss.info{border-left-color:var(--info)}.iss.info b .i{color:var(--info)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.kv{background:var(--bg2);border:1px solid var(--ln);border-radius:10px;padding:7px 10px}.kv small{color:var(--mu);font-size:10.5px;display:block}.kv b{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:6px 5px;border-bottom:1px solid var(--ln);text-align:left}th{color:var(--mu);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:6px 0;gap:2px}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--mu)}.leg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
textarea{width:100%;min-height:120px;background:var(--bg2);border:1px solid var(--ln);border-radius:10px;padding:9px;font:11.5px/1.55 'JetBrains Mono',Consolas,monospace}

/* ---------- simlar ---------- */
#wires{position:absolute;inset:0;background:radial-gradient(ellipse at center,#132034,#0a1019);z-index:3}
#wires svg{width:100%;height:100%;display:block;touch-action:none}
.pad{cursor:pointer}.wend{cursor:grab}.wend:active{cursor:grabbing}

/* ---------- sinov ---------- */
#hud{position:absolute;inset:0;pointer-events:none;z-index:4}
.hudL{position:absolute;left:12px;top:12px;background:rgba(10,14,21,.72);backdrop-filter:blur(10px);border:1px solid var(--ln2);border-radius:12px;padding:9px 12px;font-size:12px;line-height:1.65;min-width:170px;color:var(--tx2)}
.hudL b{font-size:13px;font-weight:600;color:var(--tx);font-variant-numeric:tabular-nums}
#hudMsg{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(10,14,21,.82);backdrop-filter:blur(10px);border:1px solid var(--ln2);border-radius:11px;padding:8px 15px;font-weight:500;font-size:12.5px;max-width:80%;text-align:center}
#hudFail{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(40,0,0,.4);pointer-events:auto;backdrop-filter:blur(3px)}
#hudFail div{background:var(--p1);border:1px solid rgba(255,93,93,.5);border-radius:16px;padding:20px 22px;max-width:440px;text-align:center;box-shadow:var(--sh)}
#hudFail h3{color:var(--bad);font-size:18px;font-weight:600;margin-bottom:8px}
#simStart{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,8,14,.38);backdrop-filter:blur(2px);pointer-events:auto;padding:12px}
.simCard{background:rgba(17,22,31,.96);border:1px solid var(--ln2);border-radius:16px;padding:16px 18px;max-width:390px;width:100%;box-shadow:var(--sh)}
.simCard h3{font-size:15px;font-weight:600;margin-bottom:6px;display:flex;gap:8px;align-items:center}.simCard h3 .i{color:var(--ac)}
.note{font-size:12px;color:var(--tx2);margin:2px 0 6px;line-height:1.55}
.keys div{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--ln);font-size:12px}.keys em{font-style:normal;color:var(--tx2);text-align:right}
kbd{display:inline-block;min-width:22px;padding:1px 6px;border:1px solid #39465c;border-bottom-width:3px;border-radius:6px;background:linear-gradient(#1b2433,#121925);font:600 11px/1.5 'JetBrains Mono',Consolas,monospace;text-align:center;color:#fff}
.seg{display:flex;gap:3px;background:var(--bg2);border:1px solid var(--ln);padding:3px;border-radius:10px;margin:6px 0}
.seg button{flex:1;padding:6px 8px;border-radius:7px;font-size:12px;color:var(--mu);font-weight:500;transition:.15s}.seg button:hover{color:var(--tx)}
.seg button.on{background:var(--ac);color:#1a1200;font-weight:600}
.hs{display:flex;align-items:center;gap:7px;font-weight:600;color:var(--tx)}.hs i{width:8px;height:8px;border-radius:50%;background:#8e9bb3}.hs.on i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.hm{font-size:11px;color:var(--ac);margin-bottom:2px}
.batbar{height:5px;border-radius:3px;background:#263042;overflow:hidden;margin:3px 0 5px}.batbar i{display:block;height:100%;border-radius:3px}
.stick{position:absolute;bottom:24px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.18);pointer-events:auto;touch-action:none;backdrop-filter:blur(4px)}
.stick i{position:absolute;left:43px;top:43px;width:44px;height:44px;border-radius:50%;background:rgba(255,176,32,.65);box-shadow:0 0 14px rgba(255,176,32,.4)}
#stL{left:20px}#stR{right:20px}

/* ---------- oynalar ---------- */
.modal{position:fixed;inset:0;background:rgba(4,6,10,.66);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;animation:fade .18s}
.mbox{background:linear-gradient(180deg,#141b26,#10151e);border:1px solid var(--ln2);border-radius:18px;width:100%;max-width:760px;max-height:90vh;overflow-y:auto;padding:24px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.55);animation:pop .22s}
.mbox h2{font-size:19px;font-weight:600;letter-spacing:-.01em;margin-bottom:6px}
.mclose{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;background:var(--p3);display:grid;place-items:center}.mclose:hover{background:var(--p4)}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:12px 0}
.tcard{background:var(--p2);border:1px solid var(--ln);border-radius:14px;padding:14px;text-align:left;transition:.15s}
.tcard:hover{border-color:rgba(255,176,32,.55);transform:translateY(-2px);box-shadow:var(--sh-s)}.tcard.on{border-color:var(--ac);background:var(--ac-soft)}
.tcard .ic{font-size:24px;color:var(--ac);width:42px;height:42px;border-radius:11px;background:var(--ac-soft);display:grid;place-items:center;margin-bottom:6px}
.tcard b{display:block;font-size:13.5px;font-weight:600;margin:3px 0}.tcard span{color:var(--mu);font-size:12px}
.gl{border-bottom:1px solid var(--ln);padding:11px 0}.gl b{color:var(--ac);font-weight:600}.gl small{color:var(--mu)}
.gl p{font-size:12.5px;color:var(--tx2);margin-top:3px}
.toast{position:fixed;left:50%;top:68px;transform:translateX(-50%);background:var(--p1);color:var(--tx);border:1px solid rgba(255,176,32,.5);padding:8px 15px;border-radius:11px;font-weight:500;font-size:12.5px;z-index:60;box-shadow:var(--sh);animation:pop .2s}
.pop{position:fixed;z-index:55;background:var(--p1);border:1px solid var(--ln2);border-radius:12px;padding:12px 14px;max-width:320px;font-size:12.5px;box-shadow:var(--sh)}
.pop b{color:var(--ac);font-size:13.5px;font-weight:600}.pop p{margin-top:5px;color:var(--tx2)}
@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}}
.toast{animation:none}

/* ---------- moslashuvchan ---------- */
@media (max-width:1300px){.hide-s,.logo small{display:none}.typeSw button span{display:none}main{grid-template-columns:200px 1fr 340px}}
@media (max-width:1100px){main{grid-template-columns:58px 1fr 330px}.st span,.st .pg,.stHead,.stProg{display:none}.st{justify-content:center;padding:7px 0}.st:after{display:none}}
@media (max-width:760px){
 #app{grid-template-rows:auto 1fr;height:auto;min-height:100dvh}
 header{flex-wrap:wrap;padding:8px 10px;gap:6px}#pName{order:5;max-width:none;flex-basis:100%}
 main{grid-template-columns:1fr;grid-template-rows:auto 60vh auto;gap:8px;padding:8px}
 #steps{display:flex;overflow-x:auto;padding:6px}.st{flex:none;width:auto;padding:5px;margin:0 3px 0 0}
 #viewWrap{height:60vh}.stick{width:110px;height:110px}.stick i{left:33px;top:33px}
 #hint{max-width:calc(100% - 64px)!important;font-size:11.5px}
}
@media (max-width:420px){.vt span{display:none}.vt{padding:0 8px}}
@media print{header,#steps,#viewWrap,.nav,.noprint{display:none!important}main{display:block;padding:0}#panel{overflow:visible;background:#fff;color:#000;border:0}.card,.iss,.kv{background:#fff;color:#000;border-color:#ccc}}
</style>
</head>
<body>
<div id="app">
 <header>
  <div class="logo"><img src="/konstruktor/img/logo-mark-64.png" alt="" width="26" height="26"> Konstruktor <small>loyihala · yig' · sina</small></div>
  <div class="typeSw" id="typeSw"></div>
  <input id="pName" maxlength="60" aria-label="Loyiha nomi">
  <button class="hb" id="bUndo" title="Bekor qilish (Ctrl+Z)"><i class=i-undo></i></button><button class="hb" id="bRedo" title="Qaytarish (Ctrl+Y)"><i class=i-redo></i></button>
  <span class="hsp"></span>
  <button class="hb" id="bNew"><i class=i-plus></i> <span class="hide-s">Yangi</span></button>
  <button class="hb" id="bGloss"><i class=i-book></i> <span class="hide-s">Lug'at</span></button>
  <button class="hb" id="bGallery"><i class=i-image></i> <span class="hide-s">Galereya</span></button>
  <button class="hb" id="bShare"><i class=i-link></i> <span class="hide-s">Saqlash / ulashish</span></button>
  <button class="hb" id="bAcc"><i class=i-user></i> <span id="accName" class="hide-s">Kirish</span></button>
  <button class="hb" id="bMute" title="Ovoz"><i class=i-volume></i></button>
 </header>
 <main>
  <nav id="steps"></nav>
  <section id="viewWrap">
   <div id="view">
    <div id="labels"></div>
    <div id="hint"></div>
    <div id="vtools">
     <button class="vt" id="tExplode" title="Detallarni bir-biridan uzoqlashtirib ko'rsatadi"><i class=i-explode></i><span>Ajratish</span></button>
     <button class="vt on" id="tLabels" title="Har bir detal ustida nomini ko'rsatadi"><i class=i-tag></i><span>Nomlar</span></button>
     <button class="vt" id="tXray" title="Kuzov va fuzelyajni shaffof qiladi — ichidagi detallar ko'rinadi"><i class=i-eye></i><span>Ichini ko'rish</span></button>
     <button class="vt" id="tFit" title="Kamerani modelga qaytaradi"><i class=i-target></i><span>Markazlash</span></button>
     <button class="vt on" id="tAuto" title="Model sekin o'z-o'zidan aylanadi"><i class=i-cw></i><span>Aylanish</span></button>
     <button class="vt" id="tShot" title="Ko'rinishni PNG rasm qilib saqlaydi"><i class=i-shot></i><span>Rasm</span></button>
    </div>
    <div id="tip" class="hidden"></div>
    <div id="wires" class="hidden"></div>
    <div id="hud" class="hidden">
     <div class="hudL" id="hudL"></div><div id="hudMsg"></div>
     <div class="stick hidden" id="stL"><i></i></div><div class="stick hidden" id="stR"><i></i></div>
     <div id="hudFail" class="hidden"></div>
     <div id="simStart" class="hidden"></div>
    </div>
   </div>
   <div id="metrics"></div>
  </section>
  <aside id="panel"></aside>
 </main>
</div>
<div id="modal" class="modal hidden"><div class="mbox" id="mbox"></div></div>
<script src="/lib/three.js"></script>
<script src="/konstruktor/core.js"></script>
<script src="/konstruktor/icons.js"></script>
<script src="/konstruktor/parts.js"></script>
<script src="/konstruktor/gloss.js"></script>
<script src="/konstruktor/t_copter.js"></script>
<script src="/konstruktor/t_plane.js"></script>
<script src="/konstruktor/t_car.js"></script>
<script src="/konstruktor/t_boat.js"></script>
<script src="/konstruktor/t_robot.js"></script>
<script src="/konstruktor/t_heli.js"></script>
<script src="/konstruktor/t_rocket.js"></script>
<script src="/konstruktor/t_tank.js"></script>
<script src="/konstruktor/sim.js"></script>
<script src="/konstruktor/app.js"></script>
<script src="/konstruktor/forge.js"></script>
<script src="/konstruktor/extras.js"></script>
<script src="/konstruktor/learn.js"></script>
<script src="/konstruktor/chat.js"></script>
</body>
</html>
